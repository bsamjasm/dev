<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>لوحة التراخيص</title>
<style>
:root{--bg:#0b1220;--c:#131c2f;--c2:#1b263d;--b:#27344f;--t:#e8eefc;--m:#8a9bbd;--g:#22c55e;--r:#ef4444;--y:#f59e0b;--bl:#3b82f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font-family:Cairo,Tahoma,sans-serif;padding-bottom:90px}
input,button{font:inherit;border-radius:12px;border:1px solid var(--b);padding:11px 13px;background:var(--c2);color:var(--t);min-width:0}
input:focus{outline:2px solid var(--bl)}button{cursor:pointer;border:0;font-weight:700}button:active{transform:scale(.95)}
.g{background:var(--g);color:#052e12}.r{background:var(--r);color:#fff}.y{background:var(--y);color:#2b1a00}.b{background:var(--bl);color:#fff}.s{background:var(--c2);color:var(--t);border:1px solid var(--b)}
header{position:sticky;top:0;z-index:5;background:#0b1220ee;backdrop-filter:blur(8px);padding:12px 14px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}.wrap{max-width:900px;margin:0 auto;padding:12px 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:10px 4px;text-align:center;cursor:pointer}.st.on{border-color:var(--bl);background:#172444}
.st b{display:block;font-size:22px}.st span{font-size:11px;color:var(--m)}
#q{width:100%;margin:12px 0}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.cl{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:13px;display:flex;align-items:center;gap:12px;cursor:pointer;border-inline-start:5px solid var(--g)}
.cl.off{border-inline-start-color:var(--y)}.cl.exp{border-inline-start-color:var(--r)}
.dn{min-width:58px;text-align:center}.dn b{display:block;font-size:26px;line-height:1}.dn span{font-size:11px;color:var(--m)}
.inf{flex:1;min-width:0}.nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.key{font-family:monospace;font-size:12px;color:var(--m);direction:ltr;text-align:right}.bd{font-size:12px;font-weight:700}
.fab{position:fixed;bottom:20px;inset-inline-start:20px;width:58px;height:58px;border-radius:50%;font-size:30px;padding:0;box-shadow:0 6px 20px #0008;z-index:6}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.sh{background:var(--c);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sh h2{margin:0 0 2px;font-size:19px}.sec{margin-top:14px}.sec>small{color:var(--m);display:block;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>input{flex:1}.chips button{flex:1;min-width:52px;padding:9px 4px}
.big{font-size:38px;font-weight:800;text-align:center;margin:8px 0}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#000d;border:1px solid var(--b);padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:50}#toast.on{opacity:1}
#login{max-width:380px;margin:12vh auto;padding:20px}#login .card{background:var(--c);border:1px solid var(--b);border-radius:18px;padding:20px;text-align:center}
#login input{width:100%;margin:12px 0}.hide{display:none!important}
</style></head><body>

<div id="login"><div class="card"><div style="font-size:46px">🔑</div><h2 style="margin:6px 0">لوحة التراخيص</h2>
<input id="u" placeholder="اسم المستخدم" autocomplete="username" autofocus style="margin-bottom:0">
<input id="p" type="password" placeholder="كلمة سر المطور" autocomplete="current-password">
<label style="font-size:13px;color:var(--m)"><input id="rm" type="checkbox" style="width:auto;margin:0 0 0 6px"> تذكرني بهذا الجهاز</label>
<button class="g" id="go" style="width:100%;margin-top:12px">دخول</button>
<div id="err" style="color:var(--y);margin-top:10px;min-height:20px"></div></div></div>

<div id="app" class="hide">
<header><h1>🔑 التراخيص</h1><button class="s" id="rf">⟳</button><button class="s" id="out">خروج</button></header>
<div class="wrap">
<div class="stats" id="stats"></div>
<input id="q" placeholder="🔍 بحث بالاسم أو المفتاح">
<div id="list"></div></div>
<button class="fab g" id="fab">+</button></div>

<div class="ov" id="ov"><div class="sh" id="sh"></div></div><div id="toast"></div>

<script>
const W="https://licenses.bsamjasmdell.workers.dev",D=864e5,$=i=>document.getElementById(i);
let items=[],flt="all",PW="";
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gen=()=>Array.from(crypto.getRandomValues(new Uint8Array(10)),x=>"abcdefghjkmnpqrstuvwxyz23456789"[x%31]).join("");
const left=i=>Math.ceil((i.exp-Date.now())/D);
const stOf=i=>!i.active?"off":left(i)<=0?"exp":"ok";
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2000)}
async function A(b){const r=await fetch(W+"/admin",{method:"POST",headers:{Authorization:"Bearer "+PW,"Content-Type":"application/json"},body:JSON.stringify(b)});
if(r.status==401)throw new Error("الاسم أو كلمة السر غلط");return r.json()}
async function load(){const j=await A({op:"list"});items=(j.items||[]).filter(i=>i.exp!==undefined);draw()}
async function login(){PW=$("u").value.trim()+":"+$("p").value;$("err").textContent="...";
try{await load();(($("rm").checked)?localStorage:sessionStorage).pw=PW;$("login").classList.add("hide");$("app").classList.remove("hide")}
catch(e){$("err").textContent=e.message=="Failed to fetch"?"تعذّر الاتصال بالإنترنت":e.message}}
async function save(k,o){try{const j=await A({op:"set",key:k,...o});if(j.error)return toast("⚠️ مفتاح غير صالح");
const it={key:k,name:j.name,active:j.active,exp:j.exp},x=items.findIndex(i=>i.key==k);x<0?items.push(it):items[x]=it;draw();toast("✅ تم");return it}catch(e){toast(e.message)}}
async function del(k){if(!confirm("حذف نهائي؟"))return;try{await A({op:"del",key:k});items=items.filter(i=>i.key!=k);draw();close_();toast("🗑️ انحذف")}catch(e){toast(e.message)}}
const setDays=(k,n)=>save(k,{exp:Date.now()+n*D-(n<=0?1000:0)}).then(x=>x&&open_(k));
const addDays=(k,n)=>{const i=items.find(x=>x.key==k);save(k,{exp:i.exp+n*D}).then(x=>x&&open_(k))};

function draw(){const q=$("q").value.trim().toLowerCase(),c={all:items.length,ok:0,off:0,exp:0};items.forEach(i=>c[stOf(i)]++);
$("stats").innerHTML=[["all","الكل"],["ok","فعّال"],["off","موقوف"],["exp","منتهي"]].map(([k,t])=>`<div class="st ${flt==k?"on":""}" onclick="flt='${k}';draw()"><b>${c[k]}</b><span>${t}</span></div>`).join("");
const h=items.slice().sort((a,b)=>a.exp-b.exp).filter(i=>(flt=="all"||stOf(i)==flt)&&(!q||(i.name||"").toLowerCase().includes(q)||i.key.includes(q))).map(i=>{
const s=stOf(i),l=left(i),t={ok:["var(--g)","فعّال"],off:["var(--y)","موقوف"],exp:["var(--r)","منتهي"]}[s];
return `<div class="cl ${s=="ok"?"":s}" onclick="open_('${i.key}')"><div class="dn"><b style="color:${t[0]}">${s=="exp"?"0":l}</b><span>يوم</span></div>
<div class="inf"><div class="nm">${esc(i.name)||"بدون اسم"}</div><div class="key">${i.key}</div><div class="bd" style="color:${t[0]}">${t[1]}</div></div><span style="color:var(--m)">‹</span></div>`}).join("");
$("list").innerHTML=h||'<div style="color:var(--m);padding:20px;text-align:center">لا يوجد عملاء</div>'}

function open_(k){const i=items.find(x=>x.key==k);if(!i)return;const l=left(i);
$("sh").innerHTML=`<h2>${esc(i.name)||"بدون اسم"}</h2><div class="key" style="cursor:pointer" onclick="navigator.clipboard.writeText('${k}');toast('📋 اننسخ')">${k} 📋</div>
<div class="big" style="color:${l>0&&i.active?"var(--g)":"var(--r)"}">${l>0?l:0} <small style="font-size:15px;color:var(--m)">يوم</small></div>
<div class="sec"><small>ضبط العداد من اليوم (يستبدل الأيام الحالية)</small>
<div class="row chips">${[[0,"صفر"],[1,"1"],[3,"3"],[7,"7"],[14,"14"],[30,"30"],[90,"90"],[365,"سنة"]].map(([n,t])=>`<button class="${n?"s":"r"}" onclick="setDays('${k}',${n})">${t}</button>`).join("")}</div>
<div class="row" style="margin-top:8px"><input id="cd" type="number" min="0" placeholder="عدد أيام مخصص"><button class="g" onclick="setDays('${k}',+$('cd').value||0)">ضبط</button></div></div>
<div class="sec"><small>تعديل نسبي</small><div class="row chips"><button class="s" onclick="addDays('${k}',-7)">−7</button><button class="s" onclick="addDays('${k}',-1)">−1</button><button class="s" onclick="addDays('${k}',1)">+1</button><button class="s" onclick="addDays('${k}',7)">+7</button><button class="s" onclick="addDays('${k}',30)">+30</button></div></div>
<div class="sec row"><button class="y" style="flex:1" onclick="save('${k}',{active:${!i.active}}).then(()=>open_('${k}'))">${i.active?"⏸ إيقاف":"▶ تفعيل"}</button>
<button class="b" style="flex:1" onclick="var n=prompt('الاسم:',this.dataset.n);if(n!==null)save('${k}',{name:n}).then(()=>open_('${k}'))" data-n="${esc(i.name)}">✏️ الاسم</button>
<button class="r" style="flex:1" onclick="del('${k}')">🗑 حذف</button></div>
<button class="s" style="width:100%;margin-top:12px" onclick="close_()">إغلاق</button>`;$("ov").classList.add("on")}

function add_(){$("sh").innerHTML=`<h2>➕ عميل جديد</h2><div class="sec row"><input id="an" placeholder="اسم العميل"></div>
<div class="sec row"><input id="ak" value="${gen()}" style="direction:ltr"><button class="s" onclick="$('ak').value=gen()">🎲</button></div>
<div class="sec row"><input id="ad" type="number" value="7" min="1"><span style="align-self:center;color:var(--m)">يوم</span></div>
<div class="sec row"><button class="g" style="flex:2" onclick="save($('ak').value.trim(),{name:$('an').value,active:true,exp:Date.now()+(+$('ad').value||7)*D}).then(x=>x&&open_(x.key))">حفظ</button><button class="s" style="flex:1" onclick="close_()">إلغاء</button></div>`;$("ov").classList.add("on")}
const close_=()=>$("ov").classList.remove("on");
$("ov").onclick=e=>{if(e.target==$("ov"))close_()};$("fab").onclick=add_;$("q").oninput=draw;$("rf").onclick=()=>load().then(()=>toast("⟳ تحديث")).catch(e=>toast(e.message));
$("u").addEventListener("keydown",e=>{if(e.key=="Enter")$("p").focus()});$("p").addEventListener("keydown",e=>{if(e.key=="Enter")login()});$("go").onclick=login;
$("out").onclick=()=>{localStorage.removeItem("pw");sessionStorage.clear();location.reload()};
const sp=localStorage.pw||sessionStorage.pw;if(sp){var i=sp.indexOf(":");$("u").value=sp.slice(0,i);$("p").value=sp.slice(i+1);login()}
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js");
</script></body></html>
